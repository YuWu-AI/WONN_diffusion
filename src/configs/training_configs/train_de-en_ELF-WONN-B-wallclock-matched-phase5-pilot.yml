# Phase 5 early learning-curve pilot; wall-clock matched to ELF-B on RTX 5060.
data_path: "embedded-language-flows/wmt14_de-en_train_t5"
eval_data_path: "embedded-language-flows/wmt14_de-en_validation_t5"
max_length: 128
max_input_length: 64
pad_token: eos

encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

model: ELF-WONN-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
wonn_num_oscillators: 384
wonn_num_layers: 6
wonn_num_inner_steps: 8
wonn_num_heads: 12
wonn_qk_head_dim: 64
wonn_step_init: 0.1
wonn_step_max: 0.25
wonn_coupling_mode: learned

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
label_drop_prob: 0.1
self_cond_prob: 0.5

epochs: 1
global_batch_size: null
batch_size: 4
grad_accum_steps: 1
max_optimizer_steps: 10000
lr: 0.001
weight_decay: 0.0
warmup_steps: 5000
optimizer: muon
compile_train: false
gradient_checkpointing: true
ema_decay1: 0.9999

sampling_configs_path: "src/configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 1000
online_eval: true

log_freq: 100
save_optimizer_steps: "2000,5000,10000"
save_freq: 100
eval_freq: 100

output_dir: "outputs/phase5/pilot/wonn_l6t8"
hf_repo_id: null
resume: null
use_wandb: false
seed: 42
num_workers: 4
